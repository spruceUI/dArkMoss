# Build the dArkMoss RGB30 image (Powkiddy RGB30, Rockchip RK3566) on a
# GitHub-hosted runner.
#
# dArkOS builds a Debian rootfs with debootstrap and only compiles the kernel
# and (upstream) a pile of emulators from source. dArkMoss strips the emulators
# and the EmulationStation frontend out of build_rgb30.sh - spruce provides all
# of that from TF2 - so this build is debootstrap + kernel + image assembly,
# which is far shorter and far less fragile than the JELOS-lineage MossySpruce
# build it replaces.
#
# The build needs real root, loop devices, an arm64 chroot via qemu-user-static,
# and a lot of disk. GitHub's ubuntu runner gives us passwordless sudo and loop
# devices; we reclaim disk first because the rootfs + image + 7z do not fit in
# the ~14 GB free by default.

name: build-rgb30

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (blank = no release, artifact only)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub's own hard cap for a hosted-runner job is 6h; do not impose an
    # artificial cap below it. A cold build (full qemu debootstrap + kernel +
    # build_deps) runs ~3-3.5h, which a 180 cap killed at exactly 3h.
    timeout-minutes: 360
    steps:
      - name: Reclaim runner disk
        run: |
          # The build writes a multi-GB rootfs, a raw image, and a 7z of it.
          # Clear the big preinstalled toolchains we do not use.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/swift /usr/local/share/powershell || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      # Cache is split restore/save on purpose. The combined actions/cache@v4
      # only saves on job SUCCESS, but these builds are expected to fail at the
      # next wall for a while yet, and we specifically want the ~1h debootstrap
      # seeded even when a later stage fails. The matching save steps run near
      # the end under if: !cancelled().
      - name: Restore the debootstrap rootfs cache
        id: rootfs-cache
        uses: actions/cache/restore@v4
        with:
          path: Arkbuild_package_cache
          # dArkOS reuses Arkbuild_package_cache/debian_<suite>_rootfs.tar.gz when
          # its recorded Debian version still matches stable, so a hit here skips
          # debootstrap. run_id keeps each save a fresh entry (so a re-debootstrap
          # after a Debian point release is captured); restore-keys picks the most
          # recent. Correctness is the build's own .commit check, not the key.
          key: darkmoss-rootfs-${{ hashFiles('bootstrap_rootfs-rk3566.sh', 'needed_packages.txt', 'needed_dev_packages.txt') }}-${{ github.run_id }}
          restore-keys: |
            darkmoss-rootfs-${{ hashFiles('bootstrap_rootfs-rk3566.sh', 'needed_packages.txt', 'needed_dev_packages.txt') }}-
            darkmoss-rootfs-

      - name: Restore the aarch64 toolchain cache
        id: toolchain-cache
        uses: actions/cache/restore@v4
        with:
          # Immutable toolchain, fixed key: saved once, restored forever. Kept in
          # the workspace so the runner-user cache can persist it.
          path: .toolchain-cache
          key: darkmoss-toolchain-linaro-6.3.1-2017.05

      - name: Install build prerequisites
        run: |
          # prepare.sh installs these too, but doing it here surfaces an apt
          # problem as its own clearly-labelled step instead of deep in the build.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            bc btrfs-progs build-essential bison flex ccache curl debconf-utils \
            debootstrap device-tree-compiler dosfstools e2fsprogs eatmydata gcc \
            gdisk jq lib32stdc++6 libc6-i386 libncurses5-dev libssl-dev lz4 lzop \
            p7zip-full parted python-is-python3 qemu-user-static zlib1g:i386 xfsprogs

      - name: Provision the aarch64 toolchain
        run: |
          # dArkOS wants the Linaro toolchain at the absolute /opt/toolchains
          # path. Its local-download fallback (utils.sh) works, but PATHs the
          # toolchain by a RELATIVE path, which breaks the moment the kernel
          # build cd's into main/ - "aarch64-linux-gnu-ld not found". Pre-stage
          # it at /opt/toolchains so utils.sh takes the absolute-path branch.
          # Keep the actual clone in a workspace dir (.toolchain-cache) so the
          # cache step above can persist it, then expose it at the absolute
          # /opt/toolchains path the build expects via a symlink.
          TCNAME=gcc-linaro-6.3.1-2017.05-x86_64_aarch64-linux-gnu
          LOCAL="$PWD/.toolchain-cache/$TCNAME"
          if [ ! -x "$LOCAL/bin/aarch64-linux-gnu-ld" ]; then
            mkdir -p .toolchain-cache
            git clone --depth=1 \
              https://github.com/christianhaitian/${TCNAME}.git \
              "$LOCAL"
          fi
          sudo mkdir -p /opt/toolchains
          sudo ln -sfn "$LOCAL" "/opt/toolchains/$TCNAME"
          "/opt/toolchains/$TCNAME/bin/aarch64-linux-gnu-ld" --version | head -1

      - name: Build RGB30
        run: |
          chmod +x ./*.sh
          # Build through `make`, not ./build_rgb30.sh directly: the Makefile is
          # what sets and exports DEBIAN_CODE_NAME (the debootstrap suite) and
          # the other build knobs. Bypassing it leaves DEBIAN_CODE_NAME empty and
          # debootstrap reads the mirror URL as its target ("can't cd to
          # http://deb.debian.org"), producing an empty rootfs.
          # ENABLE_CACHE=n: apt-cacher-ng buys nothing on a one-shot runner.
          # BUILD_ARMHF=n / BUILD_BLUEALSA=n: spruce brings its own userland, so
          # skip the 32-bit multiarch and bluetooth-audio setup.
          make rgb30 ENABLE_CACHE=n BUILD_ARMHF=n BUILD_BLUEALSA=n

      - name: Show what was produced
        if: always()
        run: |
          echo "=== disk ==="; df -h /
          echo "=== images ==="; ls -lh *.img *.img.7z* 2>/dev/null || echo "no image produced"
          echo "=== build log tail ==="; tail -60 build.log 2>/dev/null || true

      - name: Verify a real image was produced
        run: |
          # build_rgb30.sh runs with `set -e` off and pipes through tee, so its
          # exit code is always 0 - a silently-broken build otherwise reports
          # green. Guard on the actual artifact and on the fatal markers that
          # mean the rootfs never populated.
          if grep -qE "can't cd to http|chroot: failed to run command|debootstrap:.*(E:|failed)" build.log; then
            echo "::error::build.log shows a debootstrap/chroot failure - the rootfs did not build"
            grep -nE "can't cd to http|chroot: failed to run command|debootstrap:" build.log | head -20
            exit 1
          fi
          shopt -s nullglob
          imgs=( *.img.7z* )
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "::error::no *.img.7z produced - build did not reach image assembly"
            exit 1
          fi
          echo "image(s) produced:"; ls -lh *.img.7z*

      # Save the caches even when the build failed (but not when cancelled), so a
      # run that dies at the kernel or finishing_touches still seeds the ~1h
      # rootfs for the next iteration. Gated on the tarball actually existing, so
      # a failure DURING debootstrap cannot poison the cache with a partial.
      - name: Save the debootstrap rootfs cache
        # always() so it still seeds on a timeout/cancel, not just a clean fail;
        # gated on the tarball so a failure mid-debootstrap can't poison it.
        if: ${{ always() && hashFiles('Arkbuild_package_cache/*_rootfs.tar.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: Arkbuild_package_cache
          key: darkmoss-rootfs-${{ hashFiles('bootstrap_rootfs-rk3566.sh', 'needed_packages.txt', 'needed_dev_packages.txt') }}-${{ github.run_id }}

      - name: Save the aarch64 toolchain cache
        if: ${{ always() && steps.toolchain-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: .toolchain-cache
          key: darkmoss-toolchain-linaro-6.3.1-2017.05

      - name: Upload image artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dArkMoss-RGB30
          path: |
            *.img.7z*
          if-no-files-found: warn

      - name: Publish release
        if: success() && inputs.release_tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: "*.img.7z*"
