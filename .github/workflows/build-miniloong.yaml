# Build the dArkMoss Miniloong (Miniloong Pocket 1, Rockchip RK3566) image. All of the work is in build-image.yaml;
# this only names the unit. See build-all.yaml to build every unit at once.

name: build-miniloong

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (blank = no release, artifact only)"
        required: false
        default: ""

# The called workflow publishes the release and reads/writes the build-cache
# release, so the caller has to grant it.
permissions:
  contents: write

jobs:
  miniloong:
    uses: ./.github/workflows/build-image.yaml
    with:
      unit: miniloong
      release_tag: ${{ inputs.release_tag }}
